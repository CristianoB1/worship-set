<nav class="bg-gray-800 p-4">
  <div class="grid grid-cols-1 xl:grid-cols-12 gap-y-2">
    <div class="text-white text-2xl font-bold col-span-2">
      WorshipSet
    </div>
    <div class="col-span-8 xl:mx-2">
      <input type="text" placeholder="Buscar músicas..." class="p-1 rounded-md border w-full bg-white border-gray-300" #search (input)="filterSongs(search.value)">
      <!-- <input type="text" placeholder="Buscar música..." class="mt-2 p-2 rounded-md border border-gray-300" (input)="filterSongs($event.target.value)"> -->
    </div>
    <div class="flex gap-2 col-span-2">
      <button class=" text-white px-2 py-1.5 rounded-md hover:bg-blue-600 focus:outline-none focus:ring focus:border-blue-300" (click)="openDialogTutor('0ms ', '0ms')">Tutorial</button>
      <button class=" text-white px-2 py-1.5 rounded-md hover:bg-blue-600 focus:outline-none focus:ring focus:border-blue-300" (click)="openDialogInsert('0ms', '0ms')">Adicionar</button>
      <button class=" text-white px-2 py-1.5 rounded-md hover:bg-red-600 focus:outline-none focus:ring focus:border-blue-300" (click)="openDialogDel('0ms', '0ms')">Deletar</button>
    </div>
  </div>
</nav>

<div class="container mx-auto p-4">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    <div class="bg-white shadow-md rounded-lg p-4" *ngFor="let card of musicas">
      <h2 class="text-2xl font-bold text-gray-800 mb-2">{{ card.nome }} <i class="fas fa-music"></i></h2>
      <div class="grid grid-cols-12 gap-0.5">
        <p class="text-lg col-span-6"> ID: <span class="text-blue-500">{{ card.id }}</span></p>
        <p class="text-lg col-span-6">Tom: <span class="text-blue-500">{{ card.tom }}</span></p>
        <p class="text-lg col-span-4">BPM: <span class="text-blue-500">{{ card.bpm }}</span></p>
        <p class="text-lg col-span-8 mb-2 text-right">Categoria: <span class="text-blue-500">{{ card.categoria }}</span></p>
        <a href="{{ card.link }}" target="_blank" class="w-full block text-blue-500 underline text-lg col-span-6">Link para cifra...</a>
        <p class="text-lg col-span-6">Duração: <span class="text-blue-500">{{ card.duracao }}</span></p>
      </div>
    </div>
  </div>
</div>
